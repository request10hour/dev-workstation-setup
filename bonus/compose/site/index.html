<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI/SW 개발 워크스테이션 구축</title>
    <style>
      :root {
        color-scheme: light;
        --card: rgba(255, 255, 255, 0.85);
        --ink: #1f2933;
        --accent: #7c2d12;
        --line: rgba(31, 41, 51, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top right, rgba(249, 115, 22, 0.16), transparent 28%),
          linear-gradient(135deg, #fff7ed 0%, #e0f2fe 100%);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(680px, 100%);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: 40px 36px;
        box-shadow: 0 24px 60px rgba(31, 41, 51, 0.12);
        backdrop-filter: blur(12px);
        text-align: center;
      }

      .eyebrow {
        display: inline-block;
        margin-bottom: 18px;
        padding: 7px 12px;
        border-radius: 999px;
        background: rgba(124, 45, 18, 0.1);
        color: var(--accent);
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 8vw, 5rem);
        line-height: 1;
        letter-spacing: -0.03em;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="eyebrow">Docker Compose Bonus</span>
      <h1>Hello World</h1>
    </main>
  </body>
</html>
