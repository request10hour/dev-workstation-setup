<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compose Capture Frame</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #f0f6fb 0%, #e6efe5 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .frame {
        width: 1360px;
        border-radius: 22px;
        overflow: hidden;
        background: #fff;
        box-shadow: 0 28px 70px rgba(33, 53, 71, 0.18);
        border: 1px solid rgba(30, 41, 59, 0.08);
      }

      .topbar {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 16px 18px;
        background: #eef2f7;
        border-bottom: 1px solid rgba(148, 163, 184, 0.3);
      }

      .traffic {
        display: flex;
        gap: 8px;
      }

      .dot {
        width: 12px;
        height: 12px;
        border-radius: 999px;
      }

      .red {
        background: #ff5f57;
      }

      .yellow {
        background: #ffbd2f;
      }

      .green {
        background: #28c840;
      }

      .address {
        flex: 1;
        padding: 12px 18px;
        border-radius: 999px;
        background: #fff;
        color: #334155;
        font-size: 20px;
        line-height: 1;
        border: 1px solid rgba(148, 163, 184, 0.35);
      }

      .viewport {
        background: #fff;
      }

      .viewport img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="topbar">
        <div class="traffic">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
        </div>
        <div class="address">__URL__</div>
      </div>
      <div class="viewport">
        <img src="__IMAGE__" alt="Web page capture" />
      </div>
    </div>
  </body>
</html>
