<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI/SW 개발 워크스테이션 구축</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f1ea;
        --card: rgba(255, 255, 255, 0.85);
        --ink: #1f2933;
        --accent: #005f73;
        --accent-2: #ca6702;
        --line: rgba(31, 41, 51, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(238, 155, 0, 0.18), transparent 32%),
          linear-gradient(135deg, #fdf7ed 0%, #dceef2 100%);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(760px, 100%);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: 36px 32px;
        box-shadow: 0 24px 60px rgba(31, 41, 51, 0.12);
        backdrop-filter: blur(12px);
      }

      h1 {
        margin: 0 0 14px;
        font-size: clamp(2rem, 4vw, 3.4rem);
        line-height: 1.1;
      }

      .lead {
        margin: 0 0 22px;
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .checks {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 12px;
      }

      .check {
        padding: 16px 18px;
        border-radius: 16px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.74);
        font-size: 1rem;
        line-height: 1.6;
      }

      .check strong {
        display: inline-block;
        min-width: 122px;
        color: var(--accent-2);
      }

      code {
        font-family: "SFMono-Regular", "Menlo", monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AI/SW 개발 워크스테이션 구축</h1>
      <p class="lead">커스텀 이미지 실행과 브라우저 접속 검증을 위한 과제용 웹페이지입니다.</p>
      <ul class="checks">
        <li class="check"><strong>커스텀 이미지</strong>Dockerfile로 빌드한 웹 서버 이미지 실행 확인</li>
        <li class="check"><strong>포트 매핑</strong>호스트 포트와 컨테이너 포트를 연결해 접속 확인</li>
        <li class="check"><strong>바인드 마운트</strong>호스트 파일 변경 사항이 컨테이너에 반영되는지 확인</li>
        <li class="check"><strong>볼륨 영속성</strong>컨테이너 삭제 후에도 데이터 유지 여부를 별도 검증</li>
      </ul>
    </main>
  </body>
</html>
