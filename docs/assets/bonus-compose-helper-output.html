<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compose Helper Output</title>
  <style>
    :root {
      --bg: #dfe9f5;
      --window: #ffffff;
      --topbar: #eef4fb;
      --stroke: #cfdceb;
      --text: #16213d;
      --muted: #34425c;
      --success: #2f7d32;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
    }

    .stage {
      width: 1400px;
      height: 840px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
    }

    .window {
      width: 1264px;
      height: 686px;
      background: var(--window);
      border: 2px solid var(--stroke);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.6) inset;
    }

    .topbar {
      height: 82px;
      padding: 18px 22px;
      background: var(--topbar);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex: 0 0 auto;
    }

    .dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
    }

    .dot.red { background: #ff5f57; }
    .dot.yellow { background: #febc2e; }
    .dot.green { background: #28c840; }

    .address {
      flex: 1;
      height: 42px;
      border-radius: 21px;
      border: 2px solid #c7d5e6;
      background: #ffffff;
      color: var(--muted);
      display: flex;
      align-items: center;
      padding: 0 26px;
      font-size: 26px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .page {
      height: calc(100% - 82px);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 26px;
      background: #ffffff;
    }

    h1 {
      margin: 0;
      color: var(--text);
      font-size: 68px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.05;
    }

    .success {
      margin: 0;
      color: var(--success);
      font-size: 34px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="window">
      <div class="topbar">
        <div class="controls">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
        </div>
        <div class="address">http://web</div>
      </div>
      <div class="page">
        <h1>Compose Bonus</h1>
        <p class="success">helper-to-web-success</p>
      </div>
    </div>
  </div>
</body>
</html>
